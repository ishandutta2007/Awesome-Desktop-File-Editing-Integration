<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.05" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="lightGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Dynamic Flow Dash Animation -->
    <style>
      .flow-pulse {
        stroke-dasharray: 8 16;
        animation: flowAnimation 25s linear infinite;
      }
      .flow-pulse-rev {
        stroke-dasharray: 6 14;
        animation: flowAnimationRev 20s linear infinite;
      }
      .node-pulse {
        animation: pulseScale 3s ease-in-out infinite alternate;
      }
      .cloud-float {
        animation: floatUpDown 6s ease-in-out infinite alternate;
      }
      .badge-glow {
        animation: badgePulse 4s ease-in-out infinite alternate;
      }
      @keyframes flowAnimation {
        from { stroke-dashoffset: 400; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes flowAnimationRev {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: 350; }
      }
      @keyframes pulseScale {
        0% { transform: scale(0.98); opacity: 0.5; }
        100% { transform: scale(1.02); opacity: 0.9; }
      }
      @keyframes floatUpDown {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-8px); }
      }
      @keyframes badgePulse {
        0% { opacity: 0.7; }
        100% { opacity: 1; }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Subtle Grid Lines (Architectural Desktop / Cloud Canvas) -->
  <g stroke="#334155" stroke-opacity="0.18" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="360" />
    <line x1="250" y1="0" x2="250" y2="360" />
    <line x1="400" y1="0" x2="400" y2="360" />
    <line x1="550" y1="0" x2="550" y2="360" />
    <line x1="700" y1="0" x2="700" y2="360" />
    <line x1="850" y1="0" x2="850" y2="360" />
    <line x1="1000" y1="0" x2="1000" y2="360" />
    <line x1="1150" y1="0" x2="1150" y2="360" />
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
  </g>

  <!-- Background Ambient Synced Nodes & Dynamic Data Flow Rings -->
  <g opacity="0.4" class="cloud-float">
    <circle cx="1080" cy="80" r="60" fill="url(#cloudGrad)" filter="url(#glow)" />
    <circle cx="1120" cy="110" r="45" fill="url(#cloudGrad)" />
    <circle cx="1030" cy="110" r="40" fill="url(#cloudGrad)" />
  </g>

  <!-- Dynamic Curved Data Sync Streams (Background) -->
  <path d="M 60 300 C 250 200, 350 320, 600 290 C 850 260, 950 140, 1080 80" 
        fill="none" stroke="#38bdf8" stroke-width="2.5" opacity="0.45" class="flow-pulse" />
  <path d="M 120 40 C 300 120, 500 30, 750 90 C 920 130, 1000 240, 1140 280" 
        fill="none" stroke="#a855f7" stroke-width="2" opacity="0.35" class="flow-pulse-rev" />

  <!-- Geometric Desktop / Local File & Sync Elements (Background/Sides) -->
  <g transform="translate(80, 75)" opacity="0.6">
    <rect width="110" height="85" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <rect x="10" y="12" width="50" height="6" rx="3" fill="#38bdf8" opacity="0.8" />
    <rect x="10" y="26" width="90" height="4" rx="2" fill="#64748b" opacity="0.6" />
    <rect x="10" y="38" width="75" height="4" rx="2" fill="#64748b" opacity="0.6" />
    <rect x="10" y="50" width="85" height="4" rx="2" fill="#64748b" opacity="0.6" />
    <circle cx="92" cy="68" r="8" fill="#10b981" opacity="0.8" />
    <!-- Checkmark inside mini-card -->
    <path d="M 89 68 L 91 70 L 95 66" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <g transform="translate(1010, 205)" opacity="0.65">
    <rect width="125" height="95" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="1.5" />
    <path d="M 20 28 L 40 28 L 50 40 L 105 40 L 105 78 L 20 78 Z" fill="#334155" opacity="0.6" />
    <circle cx="65" cy="56" r="14" fill="#6366f1" opacity="0.7" />
    <!-- Bi-directional sync icon in card -->
    <path d="M 60 54 L 70 54 M 68 51 L 71 54 L 68 57 M 70 59 L 60 59 M 62 56 L 59 59 L 62 62" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- FOREGROUND CONTENT: Header Title, Subtitle, Tags (Guaranteed High Contrast & Non-Obscured) -->
  <g id="foreground-text">
    <!-- Top Category Pill / Badge -->
    <g transform="translate(600, 52)">
      <rect x="-190" y="-16" width="380" height="32" rx="16" fill="#1e293b" stroke="#6366f1" stroke-width="1.5" class="badge-glow" />
      <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#a5f3fc" text-anchor="middle" letter-spacing="1.5">
        ⚡ CLOUD-TO-DESKTOP SEAMLESS SYNC &amp; EDIT
      </text>
    </g>

    <!-- Main Title -->
    <text x="600" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle" filter="url(#lightGlow)">
      Awesome Desktop File Editing Integration
    </text>

    <!-- Decorative Gradient Underline -->
    <rect x="420" y="152" width="360" height="4" rx="2" fill="url(#accentGrad)" />

    <!-- Subtitle -->
    <text x="600" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#cbd5e1" text-anchor="middle">
      Curated Directory of Commercial SaaS Platforms &amp; Open-Source Sync Bridges
    </text>
    <text x="600" y="224" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#94a3b8" text-anchor="middle">
      Native Applications • Local Protocol Handlers • Virtual Drives • Block-Level Synchronization
    </text>

    <!-- Tech Feature Feature Badges -->
    <g transform="translate(600, 280)">
      <!-- Badge 1: Protocol Handlers -->
      <g transform="translate(-330, 0)">
        <rect x="-80" y="-15" width="160" height="30" rx="15" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" opacity="0.9" />
        <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e0f2fe" text-anchor="middle">🔗 Protocol Handlers</text>
      </g>
      <!-- Badge 2: Virtual Drives -->
      <g transform="translate(-110, 0)">
        <rect x="-75" y="-15" width="150" height="30" rx="15" fill="#0f172a" stroke="#818cf8" stroke-width="1.2" opacity="0.9" />
        <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e0e7ff" text-anchor="middle">💾 Virtual Drives</text>
      </g>
      <!-- Badge 3: Block-Level Sync -->
      <g transform="translate(110, 0)">
        <rect x="-80" y="-15" width="160" height="30" rx="15" fill="#0f172a" stroke="#c084fc" stroke-width="1.2" opacity="0.9" />
        <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#f5d0fe" text-anchor="middle">⚡ Block-Level Sync</text>
      </g>
      <!-- Badge 4: Zero Trust & E2EE -->
      <g transform="translate(330, 0)">
        <rect x="-80" y="-15" width="160" height="30" rx="15" fill="#0f172a" stroke="#34d399" stroke-width="1.2" opacity="0.9" />
        <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#d1fae5" text-anchor="middle">🔒 E2EE &amp; Zero-Trust</text>
      </g>
    </g>
  </g>
</svg>